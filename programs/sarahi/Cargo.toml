[package]
name = "sarahi"
version = "0.1.0"
description = "SARAHI: crypto loans backed by tokenized real estate (RWA)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sarahi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Adjust versions to match your toolchain (verified build used Anchor 1.2.2).
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.1.0"
